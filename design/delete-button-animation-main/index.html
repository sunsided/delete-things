<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Button Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="paperIcon" class="paper-icon">📄</div>
        <button id="deleteButton" class="delete-btn" onclick="animateDeletion()">
            <span id="deletionText">
                <span id="trashIcon">🗑️</span>&nbsp;<span id="deleteText">Delete</span>
            </span>
            <span id="confirmationText">
                ✅&nbsp;Deleted
            </span>
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
