name: Pages

# Publishes the prerendered page to GitHub Pages. Manual for now: run it from the Actions
# tab once Pages is enabled for the repository with "GitHub Actions" as the source.
#
# The project site lives under /<repo>/, so the build gets that as its BASE_PATH. Every
# link is relative anyway; the base keeps SvelteKit's own idea of where it lives right.

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # See ci.yml: package-manager-cache must be off until Corepack is enabled.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: corepack enable

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - run: yarn playwright install --with-deps chromium

      # Nothing is published that has not passed the full chain.
      - run: task ci
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
